# SURYA Production Nginx Hardening Reference (Stage 7 / WP-8)
limit_req_zone $binary_remote_addr zone=surya_api:10m rate=20r/s;

server {
    listen 443 ssl http2;
    server_name surya.institute.local;

    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https: wss:;" always;

    location /api/rag/ {
        limit_req zone=surya_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000/;
        proxy_read_timeout 120s;
    }

    location / {
        root /var/www/surya/dist;
        try_files $uri $uri/ /index.html;
    }
}
