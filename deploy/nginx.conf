# SURYA — nginx for Windows. Serves the SPA + same-origin proxy to the RAG API
# (same origin => no CORS anywhere). Drop into nginx conf/, adjust paths + cert.

server {
    listen 443 ssl;
    server_name surya.institute.local;

    ssl_certificate     C:/surya/certs/surya.crt;   # institute-CA-signed preferred
    ssl_certificate_key C:/surya/certs/surya.key;

    # SPA (HashRouter — deep links live after the #, so try_files is belt-and-braces)
    root C:/surya/dist;
    location / {
        try_files $uri /index.html;
    }

    # Ask SURYA query API (surya-rag-api service on localhost)
    location /rag/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_read_timeout 300s;   # Ollama cold model loads are slow on CPU
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name surya.institute.local;
    return 301 https://$host$request_uri;
}
