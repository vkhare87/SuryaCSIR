# SURYA — nginx for Windows. Serves the SPA + same-origin proxy to the RAG API
# (same origin => no CORS anywhere). Drop into nginx conf/, adjust paths + cert.
#
# Before use (deploy/README.md §5):
#   1. Replace __SUPABASE_ORIGIN__ (twice) with the project origin from
#      VITE_SUPABASE_URL, e.g. https://abcd1234.supabase.co (no trailing slash).
#   2. Put this line in the http { } block of nginx.conf — NOT in this file;
#      nginx refuses limit_req_zone inside server { }, and without it the
#      /rag/ block below fails with "zero size shared memory zone":
#        limit_req_zone $binary_remote_addr zone=rag_query:10m rate=6r/m;

server {
    listen 443 ssl;
    server_name surya.institute.local;

    ssl_certificate     C:/surya/certs/surya.crt;   # institute-CA-signed preferred
    ssl_certificate_key C:/surya/certs/surya.key;

    # Security headers (SEC-08). `always` so error pages carry them too. No
    # location below sets its own add_header, so all of them inherit these.
    #   style-src 'unsafe-inline': framer-motion and React style props.
    #   'wasm-unsafe-eval' + worker-src blob:: the AWP OCR (tesseract.js) and
    #     pdf.js workers, all served from 'self'.
    #   frame-src blob: + Supabase: PDF previews (local file, signed URL).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' __SUPABASE_ORIGIN__; frame-src 'self' blob: __SUPABASE_ORIGIN__; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" always;

    # SPA (HashRouter — deep links live after the #, so try_files is belt-and-braces)
    root C:/surya/dist;
    location / {
        try_files $uri /index.html;
    }

    # Ask SURYA query API (surya-rag-api service on localhost). Each call can
    # cost a model run: 6 a minute per client IP, burst 3, then 429 (SEC-09).
    location /rag/ {
        limit_req        zone=rag_query burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000/;
        proxy_read_timeout 300s;   # Ollama cold model loads are slow on CPU
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}

server {
    listen 80;
    server_name surya.institute.local;
    return 301 https://$host$request_uri;
}
